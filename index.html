<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon GO 総合攻略ハブ (自動更新連動版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: auto; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes pulseFocus { 0% { box-shadow: 0 0 0 0 rgba(2,132,199,0.7); } 70% { box-shadow: 0 0 0 14px rgba(2,132,199,0); } 100% { box-shadow: 0 0 0 0 rgba(2,132,199,0); } }
    .pulse-target { animation: pulseFocus 1.2s ease-out 2; }
    .bar-main { background: linear-gradient(90deg, #e0f2fe, #bae6fd); border: 1px solid #38bdf8; color: #0369a1; }
    .bar-raid { background: linear-gradient(90deg, #dcfce7, #bbf7d0); border: 1px solid #4ade80; color: #15803d; }
    .bar-dmax { background: linear-gradient(90deg, #f3e8ff, #e9d5ff); border: 1px solid #c084fc; color: #7e22ce; }
    .bar-collab { background: linear-gradient(90deg, #ccfbf1, #99f6e4); border: 1px solid #2dd4bf; color: #0f766e; }
    .bar-cd { background: linear-gradient(90deg, #fef3c7, #fde68a); border: 1px solid #f59e0b; color: #b45309; }
    .bg-9db-card { background: radial-gradient(circle at center, #2e1065 0%, #170b2c 70%, #0d061a 100%); }
    .gantt-sticky-label { position: sticky; left: 6px; display: inline-flex; align-items: center; gap: 4px; max-width: calc(100vw - 65px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="swipeBackIndicator" class="fixed left-0 top-1/2 -translate-y-1/2 z-50 pointer-events-none opacity-0 -translate-x-full bg-sky-600 text-white px-3 py-2 rounded-r-full shadow-lg font-bold text-xs transition-all flex items-center gap-1">
    <span>←</span> 戻る
  </div>
  <button id="floatingBackBtn" onclick="triggerBackNavigation()" class="hidden fixed bottom-5 left-4 z-50 bg-slate-900/90 text-white text-xs font-bold px-3.5 py-2.5 rounded-full shadow-xl flex items-center gap-2">
    <span>←</span> <span id="floatingBackLabel">戻る</span>
  </button>

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-base sm:text-lg font-black bg-gradient-to-r from-sky-600 to-amber-600 bg-clip-text text-transparent">Pokémon GO 総合攻略ハブ</h1>
          <div class="text-[11px] text-slate-500 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="autoUpdateTimestamp" class="font-bold">自動更新: 取得中...</span>
          </div>
        </div>
      </div>
      <button onclick="restoreAllHiddenEvents()" id="globalRestoreBtn" class="hidden text-[10px] bg-amber-50 text-amber-700 border border-amber-300 px-2 py-1 rounded">全表示</button>
    </div>
  </header>

  <!-- 5大ナビゲーションタブ -->
  <div class="max-w-6xl mx-auto w-full px-4 pt-3 pb-1">
    <nav class="grid grid-cols-5 gap-1 p-1 bg-slate-200/80 rounded-xl border border-slate-300 shadow-inner">
      <button id="tabNavSeason" onclick="switchMainTab('season')" class="py-2 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600">🏆 シーズン</button>
      <button id="tabNavSchedule" onclick="switchMainTab('schedule')" class="py-2 text-[10px] sm:text-xs font-bold rounded-lg bg-white text-sky-700 shadow-sm">📅 日程</button>
      <button id="tabNavBattles" onclick="switchMainTab('battles')" class="py-2 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600">⚔️ バトル</button>
      <button id="tabNavResearch" onclick="switchMainTab('research')" class="py-2 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600">🔍 リサーチ</button>
      <button id="tabNavGoPass" onclick="switchMainTab('gopass')" class="py-2 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600">🎫 GOパス</button>
    </nav>
  </div>

  <main class="max-w-6xl mx-auto w-full px-4 py-3 flex-1 pb-16">

    <!-- タブ0: シーズン常設 -->
    <div id="tabContentSeason" class="space-y-4 hidden">
      <div class="bg-white border border-orange-200 rounded-xl p-4 shadow-sm space-y-3" id="seasonContainer">
        <h2 class="text-lg font-black text-slate-900">🏆 シーズン常設ガイド</h2>
        <div id="seasonContent" class="text-xs text-slate-600">読込中...</div>
      </div>
    </div>

    <!-- タブ1: イベント日程 -->
    <div id="tabContentSchedule" class="space-y-4">
      <section class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="bg-white border border-rose-200 rounded-xl p-3.5 shadow-sm">
          <h2 class="text-sm font-extrabold text-rose-600 mb-2">🚨 本日開催中・注目のイベント</h2>
          <ul id="todayEventsList" class="text-xs space-y-2 text-slate-700"></ul>
        </div>
        <div class="bg-white border border-sky-200 rounded-xl p-3.5 shadow-sm">
          <h2 class="text-sm font-extrabold text-sky-700 mb-2">📢 4サイト統合・最新ニュース速報</h2>
          <div id="newsItemsContainer" class="space-y-1.5 text-xs max-h-48 overflow-y-auto"></div>
        </div>
      </section>

      <section class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-extrabold text-slate-900">📊 ガントチャート</h2>
          <div id="ganttMonthBtnGroup" class="flex gap-1 bg-slate-100 p-1 rounded-lg"></div>
        </div>
        <div class="relative overflow-x-auto rounded-lg border border-slate-200 bg-white" id="ganttScrollWrapper">
          <div id="ganttTimelineTable" class="min-w-[800px] select-none">
            <div id="ganttHeaderRow" class="grid sticky top-0 z-20 bg-slate-50 border-b border-slate-200 text-center text-xs font-bold text-slate-600"></div>
            <div id="ganttTracksContainer" class="relative py-2 space-y-1"><div id="ganttBgGrid" class="absolute inset-0 grid pointer-events-none"></div></div>
          </div>
        </div>
      </section>

      <section class="space-y-3">
        <h2 class="text-sm font-extrabold text-slate-800">📌 イベント詳細・タスク一覧</h2>
        <div id="eventsAccordionContainer" class="space-y-2.5"></div>
        <details class="bg-white border border-slate-200 rounded-xl mt-4"><summary class="p-3 text-xs font-bold text-slate-600 cursor-pointer">📂 終了済みアーカイブ</summary><div id="archivedEventsList" class="p-3 pt-0 text-xs"></div></details>
      </section>
    </div>

    <!-- タブ2: レイド & DMax -->
    <div id="tabContentBattles" class="space-y-4 hidden">
      <div class="flex gap-2 p-1 bg-slate-200/80 rounded-xl">
        <button id="subTabRaids" onclick="switchBattleSub('raids')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm">⚔️ レイド対策</button>
        <button id="subTabDmax" onclick="switchBattleSub('dmax')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600">💥 DMax対策</button>
      </div>
      <div id="secBattleRaids" class="space-y-3">
        <div id="raidBossPickerCurrent" class="grid grid-cols-1 sm:grid-cols-3 gap-2"></div>
        <div id="raidBossOverview"></div>
        <div id="raidMegaRecommendBox"></div>
        <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
          <div class="flex justify-between items-center mb-2 border-b pb-2">
            <h3 class="text-sm font-black text-slate-900" id="raidRankingTitle">対策ランキング</h3>
            <div class="flex gap-2">
              <button id="btnSortDps" onclick="setRaidSortMode('dps')" class="text-[10px] px-2 py-1 rounded bg-sky-600 text-white font-bold">DPS順</button>
              <button id="btnSortTdo" onclick="setRaidSortMode('tdo')" class="text-[10px] px-2 py-1 rounded bg-slate-100 text-slate-600 font-bold">TDO順</button>
            </div>
          </div>
          <div id="raidRankingList" class="space-y-1.5"></div>
        </div>
      </div>
      <div id="secBattleDmax" class="space-y-3 hidden">
        <div id="dmaxBossPickerCurrent" class="grid grid-cols-1 sm:grid-cols-3 gap-2"></div>
        <div id="dmax9dbContainer"></div>
      </div>
    </div>

    <!-- タブ3(新): 🔍 リサーチ一覧 -->
    <div id="tabContentResearch" class="space-y-4 hidden">
      <div class="bg-white border border-teal-200 rounded-xl p-4 shadow-sm space-y-3">
        <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-2">
          <h2 class="text-base font-black text-slate-900">🔍 フィールドリサーチ全一覧</h2>
          <input type="text" id="resSearchInput" oninput="renderResearchTab()" placeholder="タスク・報酬で検索..." class="text-xs border rounded-lg px-2 py-1.5 w-48">
        </div>
        <div class="flex flex-wrap gap-1.5 pb-2">
          <button onclick="setResFilter('all')" id="resFilter-all" class="text-[11px] px-3 py-1 rounded-full font-bold bg-teal-600 text-white">すべて</button>
          <button onclick="setResFilter('event')" id="resFilter-event" class="text-[11px] px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-600">🎃 イベント限定</button>
          <button onclick="setResFilter('catch')" id="resFilter-catch" class="text-[11px] px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-600">⚾ 捕獲系</button>
          <button onclick="setResFilter('battle')" id="resFilter-battle" class="text-[11px] px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-600">⚔️ バトル</button>
          <button onclick="setResFilter('explore')" id="resFilter-explore" class="text-[11px] px-3 py-1 rounded-full font-bold bg-slate-100 text-slate-600">🥚 その他</button>
        </div>
        <div id="masterResearchListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs"></div>
      </div>
    </div>

    <!-- タブ4: GOパス -->
    <div id="tabContentGoPass" class="space-y-4 hidden">
      <div id="goPassContainer" class="bg-white border border-amber-200 rounded-xl p-4 shadow-sm">
        <h2 class="text-base font-black text-slate-900 mb-2">🎫 GOパス情報</h2>
        <div id="goPassContent" class="text-xs text-slate-600">読込中...</div>
      </div>
    </div>

  </main>

  <script>
    // --- マスターデータ（data.jsonから全自動ロード） ---
    let MASTER = { events: [], news: [], raids: {}, dmax: {}, researches: [], gopass: {} };
    let currentMainTab = "schedule";
    let currentBattleSub = "raids";
    let activeRaidKey = "";
    let activeDmaxKey = "";
    let raidSortMode = "dps";
    let resFilter = "all";
    let hiddenEventIds = new Set();
    const now = new Date();
    const tMonth = now.getMonth() + 1, tDate = now.getDate(), tYear = now.getFullYear();
    let currentGanttMonth = tMonth;

    // --- ポケモンID逆引きヘルパー ---
    function resolveSpecialFormId(dex, name) {
      const id = Number(dex) || 25, n = String(name || "");
      if (id >= 10000) return id;
      if (n.includes("キョダイ")) {
        const m = {"フシギバナ":10195,"リザードン":10196,"カメックス":10197,"カイリキー":10201,"ゲンガー":10202,"オーロンゲ":10222,"ジュラルドン":10225};
        for(let k in m) if(n.includes(k)) return m[k];
      }
      if (n.includes("メガ")||n.includes("ゲンシ")) {
        const m = {"サーナイト":10051,"ヤミラミ":10066,"バンギラス":10049,"リザードンY":10035,"ゲンガー":10038,"ジュペッタ":10056,"メタグロス":10076,"カイオーガ":10077,"グラードン":10078,"レックウザ":10079,"ルカリオ":10059,"シャンデラ":609};
        for(let k in m) if(n.includes(k)) return m[k];
      }
      if (n.includes("ザシアン")) return 10188;
      if (n.includes("ザマゼンタ")) return 10189;
      if (n.includes("オリジン")) { if(n.includes("ギラティナ")) return 10007; if(n.includes("ディアルガ")) return 10245; if(n.includes("パルキア")) return 10246; }
      if (n.includes("ブラックキュレム")) return 10022; if (n.includes("ホワイトキュレム")) return 10023;
      if (n.includes("あかつき")) return 10156; if (n.includes("たそがれ")) return 10155;
      return id;
    }
    const getPokeImg = (dex, name) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${resolveSpecialFormId(dex, name)}.png`;

    // --- タブ切り替え ---
    function switchMainTab(tab) {
      currentMainTab = tab;
      const tMap = { "season": "text-orange-700", "schedule": "text-sky-700", "battles": "text-emerald-700", "research": "text-teal-700", "gopass": "text-amber-700" };
      Object.keys(tMap).forEach(k => {
        const active = (k === tab);
        const btn = document.getElementById("tabNav" + k.charAt(0).toUpperCase() + k.slice(1));
        if(btn) btn.className = active ? `py-2 text-[10px] sm:text-xs font-bold rounded-lg bg-white ${tMap[k]} shadow-sm` : `py-2 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900`;
        const content = document.getElementById("tabContent" + k.charAt(0).toUpperCase() + k.slice(1));
        if(content) content.classList.toggle("hidden", !active);
      });
      if (tab === "battles") renderBattleTab();
    }

    // --- データロード ＆ 初期化 ---
    window.onload = function() {
      fetch('./data.json?t=' + new Date().getTime()).then(r => r.json()).then(data => {
        if(data.updated_at) document.getElementById('autoUpdateTimestamp').innerText = '最終更新: ' + data.updated_at;
        MASTER.events = data.dynamic_events || [];
        MASTER.news = data.latest_news || [];
        MASTER.raids = data.dynamic_raids || {};
        MASTER.dmax = data.dynamic_dmax || {};
        MASTER.researches = data.all_field_researches || [];
        MASTER.gopass = data.event_gopass || {};

        // 🔍 第5タブからイベントリサーチを自動連動注入！
        const byEv = {};
        MASTER.researches.forEach(r => {
          if (r.category === "event" && r.event_id) {
            if(!byEv[r.event_id]) byEv[r.event_id] = [];
            byEv[r.event_id].push(r);
          }
        });
        MASTER.events.forEach(ev => { if (byEv[ev.id]) ev.fieldResearches = byEv[ev.id]; });

        const rKeys = Object.keys(MASTER.raids), dKeys = Object.keys(MASTER.dmax);
        if(rKeys.length) activeRaidKey = rKeys[0];
        if(dKeys.length) activeDmaxKey = dKeys[0];

        renderNews();
        renderGantt();
        renderEvents();
        renderResearchTab();
      }).catch(e => console.error("Data load error:", e));
    };

    // --- レンダリング処理 ---
    function renderNews() {
      document.getElementById("newsItemsContainer").innerHTML = MASTER.news.map(n => `
        <div class="bg-slate-50 border p-2 rounded-lg flex justify-between gap-2 cursor-pointer hover:bg-slate-100" onclick="scrollToEv('${n.targetId}')">
          <div class="text-[11px] font-bold text-sky-700 bg-sky-100 border-sky-200 border px-1.5 py-0.5 rounded flex-shrink-0">[${n.date_label || n.date}]</div>
          <div class="line-clamp-1 font-bold text-slate-800 flex-1">${n.title}</div>
        </div>
      `).join("");
    }

    function renderGantt() {
      const mGroup = document.getElementById("ganttMonthBtnGroup");
      const mList = [tMonth, (tMonth%12)+1, ((tMonth+1)%12)+1];
      mGroup.innerHTML = mList.map(m => `<button onclick="changeGanttMonth(${m})" class="text-xs px-2 py-1 rounded font-bold ${m===currentGanttMonth ? 'bg-sky-600 text-white':'text-slate-600'}">${m}月</button>`).join("");
      
      const headerRow = document.getElementById("ganttHeaderRow");
      const bgGrid = document.getElementById("ganttBgGrid");
      const tracksContainer = document.getElementById("ganttTracksContainer");
      tracksContainer.querySelectorAll(".gantt-event-row").forEach(r => r.remove());
      headerRow.innerHTML = ""; bgGrid.innerHTML = "";

      const daysInMonth = new Date(tYear, currentGanttMonth, 0).getDate();
      const sDay = (currentGanttMonth === tMonth) ? tDate : 1;
      const gTemp = `repeat(${daysInMonth - sDay + 1}, minmax(40px, 1fr))`;
      headerRow.style.gridTemplateColumns = gTemp; bgGrid.style.gridTemplateColumns = gTemp;

      for (let d = sDay; d <= daysInMonth; d++) {
        const isToday = (currentGanttMonth === tMonth && d === tDate);
        headerRow.innerHTML += `<div class="py-1 border-r ${isToday?'bg-sky-50 text-sky-800 border-b-2 border-sky-500 font-black':''}">${currentGanttMonth}/${d}</div>`;
        bgGrid.innerHTML += `<div class="border-r ${isToday?'bg-sky-50/40':''}"></div>`;
      }

      MASTER.events.filter(ev => !hiddenEventIds.has(ev.id) && ev.month === currentGanttMonth).forEach(ev => {
        const evStart = Math.max(ev.startDay, sDay), evEnd = Math.min(ev.endDay, daysInMonth);
        if (evStart > daysInMonth || evEnd < sDay) return;
        const row = document.createElement("div");
        row.className = "gantt-event-row relative h-6 flex items-center";
        row.style.display = "grid"; row.style.gridTemplateColumns = gTemp;
        const bar = document.createElement("div");
        bar.className = `${ev.barClass || 'bg-sky-200 text-sky-800 border-sky-400'} border h-5 rounded px-1.5 text-[10px] font-bold cursor-pointer truncate flex items-center shadow-sm z-10`;
        bar.style.gridColumn = `${evStart - sDay + 1} / span ${evEnd - evStart + 1}`;
        bar.innerText = ev.title;
        bar.onclick = () => scrollToEv(ev.id);
        row.appendChild(bar);
        tracksContainer.appendChild(row);
      });
    }
    function changeGanttMonth(m) { currentGanttMonth = m; renderGantt(); }

    function renderEvents() {
      const container = document.getElementById("eventsAccordionContainer");
      container.innerHTML = MASTER.events.filter(e => !hiddenEventIds.has(e.id)).map((ev, i) => {
        const frHtml = (ev.fieldResearches && ev.fieldResearches.length > 0) ? `
          <div class="bg-teal-50 border border-teal-200 p-2.5 rounded-lg">
            <div class="text-[11px] font-extrabold text-teal-800 mb-1.5">🔍 イベント限定リサーチ（第5タブ自動同期済）</div>
            <div class="space-y-1">${ev.fieldResearches.map(fr => `<div class="bg-white p-1.5 border rounded flex justify-between text-[11px]"><span>📋 ${fr.task}</span><strong class="text-amber-800">${fr.rewardName}</strong></div>`).join("")}</div>
          </div>
        ` : '';
        const gmHtml = (ev.specialGimmicks && ev.specialGimmicks.length > 0) ? ev.specialGimmicks.map(gm => `
          <div class="bg-amber-50 border border-amber-300 p-2.5 rounded-lg mt-2">
            <div class="text-[11px] font-extrabold text-amber-900">📦 ${gm.gimmick_name}</div>
            <div class="text-[10px] text-slate-700">${gm.description}</div>
          </div>
        `).join("") : '';

        return `
          <details class="bg-white border rounded-xl overflow-hidden shadow-sm" id="${ev.id}" ${i<3?'open':''}>
            <summary class="p-3 cursor-pointer hover:bg-slate-50 font-extrabold text-sm flex justify-between">${ev.dateText} | ${ev.title} <span class="text-xs font-normal text-slate-400">▼</span></summary>
            <div class="p-3 pt-0 border-t space-y-2 text-xs">
              <div class="bg-slate-50 p-2 rounded border">${ev.summary}</div>
              ${gmHtml}
              ${frHtml}
            </div>
          </details>
        `;
      }).join("");
    }

    // --- 第5タブ：リサーチ全一覧 ---
    function setResFilter(c) { resFilter = c; renderResearchTab(); }
    function renderResearchTab() {
      const container = document.getElementById("masterResearchListContainer");
      const q = (document.getElementById("resSearchInput")?.value || "").toLowerCase();
      const filtered = MASTER.researches.filter(r => {
        if(resFilter !== "all" && r.category !== resFilter) return false;
        if(q && !r.task.toLowerCase().includes(q) && !r.rewardName.toLowerCase().includes(q)) return false;
        return true;
      });
      container.innerHTML = filtered.map(r => `
        <div class="${r.category==='event' ? 'bg-amber-50 border-amber-300':'bg-slate-50 border-slate-200'} border p-2.5 rounded-lg flex flex-col justify-between">
          <div><div class="text-[10px] font-bold text-slate-500 mb-1">${r.EventName || ''}</div><div class="font-black text-slate-800">📋 ${r.task}</div></div>
          <div class="mt-1.5 flex items-center gap-1"><img src="${getPokeImg(r.rewardDex, r.rewardName)}" class="w-6 h-6"><strong class="text-amber-800">${r.rewardName} ${r.shiny?'✨':''}</strong></div>
        </div>
      `).join("");
    }

    function scrollToEv(id) {
      switchMainTab('schedule');
      const el = document.getElementById(id);
      if(el) { el.open = true; el.scrollIntoView({behavior:'smooth'}); }
    }
    function switchBattleSub(type) {
      document.getElementById("secBattleRaids").classList.toggle("hidden", type !== 'raids');
      document.getElementById("secBattleDmax").classList.toggle("hidden", type !== 'dmax');
    }
  </script>
</body>
</html>

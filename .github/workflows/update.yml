name: Scheduled Pokemon GO Data Update

on:
  schedule:
    # 日本時間 8:00, 11:00, 14:00, 17:00, 20:00, 24:00 に自動実行 (UTC 23, 2, 5, 8, 11, 15時)
    - cron: '0 2,5,8,11,15,23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: AI自動解析スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "AI auto update Pokemon GO data [skip ci]" || exit 0
          git push

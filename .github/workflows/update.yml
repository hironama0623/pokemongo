name: Scheduled Pokemon GO Data Update

on:
  schedule:
    # 日本時間 9:00, 12:00, 15:00, 18:00, 21:00 に実行
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: AI自動解析スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "AI auto update Pokemon GO data [skip ci]" || exit 0
          git push

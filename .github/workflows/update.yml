name: Scheduled Pokemon GO Data Update

on:
  schedule:
    # 日本時間 7:00 / 12:00 / 18:00 / 22:00 (UTC 22, 3, 9, 13時)
    - cron: '0 3,9,13,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run=通常 / diagnose=取得とログのみ(AI解析なし) / bootstrap=初回取り込み(ニュースを作らない)'
        default: 'run'
        type: choice
        options: [run, diagnose, bootstrap]

concurrency:
  group: pogo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存ライブラリ
        run: pip install -r requirements.txt

      - name: ブラウザ(Chromium)の準備
        run: python -m playwright install --with-deps chromium

      - name: 取得・解析・検証・保存
        id: update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            diagnose)  python -m scripts.run --diagnose ;;
            bootstrap) python -m scripts.run --no-news ;;
            *)         python -m scripts.run ;;
          esac

      # 失敗しても logs/ と data/meta.json は必ず保存する（失敗が見えるようにする）
      - name: 変更をコミット＆プッシュ
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data data.json logs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "auto update: data & logs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
